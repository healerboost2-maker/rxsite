<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>AudioBridge Receiver - AM / AudioBridge</title>
                <style>
                        * { box-sizing: border-box; }
                                body {
                                            margin: 0; min-height: 100vh; background: #101418; color: #e8edf2;
                                                        font-family: Arial, sans-serif; display: flex; justify-content: center;
                                                                    align-items: center; padding: 20px;
                                                                            }
                                                                                    .panel {
                                                                                                width: 100%; max-width: 560px; background: #1b2229;
                                                                                                            border: 1px solid #39444e; border-radius: 12px; padding: 24px;
                                                                                                                    }
                                                                                                                            h1 { margin: 0 0 6px; font-size: 25px; letter-spacing: 1px; }
                                                                                                                                    .subtitle { color: #9eabb6; font-size: 13px; margin-bottom: 24px; }
                                                                                                                                            .server-config { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
                                                                                                                                                    .server-config label { color: #9eabb6; font-size: 12px; font-weight: bold; }
                                                                                                                                                            .server-config input {
                                                                                                                                                                        background: #11171c; border: 1px solid #303b44; border-radius: 6px;
                                                                                                                                                                                    padding: 10px; color: #4ade80; font-family: Consolas, monospace; font-size: 13px;
                                                                                                                                                                                            }
                                                                                                                                                                                                    .status-box {
                                                                                                                                                                                                                background: #11171c; border: 1px solid #303b44; border-radius: 8px;
                                                                                                                                                                                                                            padding: 14px; margin-bottom: 18px;
                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                            .status-line { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 9px; font-size: 14px; }
                                                                                                                                                                                                                                                    .status-line:last-child { margin-bottom: 0; }
                                                                                                                                                                                                                                                            .label { color: #9eabb6; }
                                                                                                                                                                                                                                                                    .value { font-weight: bold; text-align: right; }
                                                                                                                                                                                                                                                                            .online { color: #4ade80; }
                                                                                                                                                                                                                                                                                    .offline { color: #ff6b6b; }
                                                                                                                                                                                                                                                                                            .warning { color: #facc15; }
                                                                                                                                                                                                                                                                                                    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-bottom: 22px; }
                                                                                                                                                                                                                                                                                                            button { border: 0; border-radius: 7px; padding: 13px 7px; font-size: 12px; font-weight: bold; cursor: pointer; color: white; }
                                                                                                                                                                                                                                                                                                                    button:disabled { opacity: 0.35; cursor: not-allowed; }
                                                                                                                                                                                                                                                                                                                            #connectButton { background: #2563eb; }
                                                                                                                                                                                                                                                                                                                                    #playButton { background: #16a34a; }
                                                                                                                                                                                                                                                                                                                                            #pauseButton { background: #ca8a04; }
                                                                                                                                                                                                                                                                                                                                                    #disconnectButton { background: #dc2626; }
                                                                                                                                                                                                                                                                                                                                                            .meter-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: #9eabb6; }
                                                                                                                                                                                                                                                                                                                                                                    .db-value { color: #4ade80; font-weight: bold; }
                                                                                                                                                                                                                                                                                                                                                                            .meter { height: 28px; background: #080b0e; border: 1px solid #303b44; border-radius: 5px; overflow: hidden; display: flex; gap: 2px; padding: 4px; }
                                                                                                                                                                                                                                                                                                                                                                                    .meter-bar { flex: 1; background: #26313a; border-radius: 2px; }
                                                                                                                                                                                                                                                                                                                                                                                            .meter-bar.green { background: #22c55e; }
                                                                                                                                                                                                                                                                                                                                                                                                    .meter-bar.yellow { background: #eab308; }
                                                                                                                                                                                                                                                                                                                                                                                                            .meter-bar.red { background: #ef4444; }
                                                                                                                                                                                                                                                                                                                                                                                                                    .scale { display: flex; justify-content: space-between; color: #6f7d88; font-size: 10px; margin-top: 5px; }
                                                                                                                                                                                                                                                                                                                                                                                                                            .log-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
                                                                                                                                                                                                                                                                                                                                                                                                                                    .log-actions button { background: #334155; }
                                                                                                                                                                                                                                                                                                                                                                                                                                            .log { margin-top: 8px; background: #080b0e; border: 1px solid #303b44; border-radius: 7px; padding: 12px; height: 165px; overflow-y: auto; font-family: Consolas, monospace; font-size: 12px; color: #b8c4ce; white-space: pre-wrap; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                    @media (max-width: 500px) { .buttons { grid-template-columns: repeat(2, 1fr); } }
                                                                                                                                                                                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                        </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="panel">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h1>AUDIOBRIDGE RECEIVER — AM</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="subtitle">Live audio receiver and monitor</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="server-config">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label for="serverInput">SERVER WEBSOCKET URL</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="text" id="serverInput" spellcheck="false" />
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="status-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="status-line"><span class="label">Server</span><span id="serverStatus" class="value offline">Disconnected</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="status-line"><span class="label">Audio Engine</span><span id="audioStatus" class="value offline">Stopped</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="status-line"><span class="label">Audio Format</span><span id="formatStatus" class="value">Waiting for stream</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="status-line"><span class="label">Received Packets</span><span id="packetCount" class="value">0</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="status-line"><span class="label">Received Bytes</span><span id="byteCount" class="value">0</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="buttons">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button id="connectButton">CONNECT</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button id="playButton" disabled>PLAY</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button id="pauseButton" disabled>PAUSE</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button id="disconnectButton" disabled>DISCONNECT</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="meter-header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <span>RECEIVED AUDIO LEVEL</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <span id="dbValue" class="db-value">-60 dB</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="meter" class="meter"></div>
